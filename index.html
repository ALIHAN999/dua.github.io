<!doctype html>
<html lang="ru">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#254689" />
    <title>Дуа из Корана и Сунны</title>

    <!-- Noto Naskh Arabic for Arabic body text & Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="favicon.png" />

    <style>
      :root {
        --bg: #3d5c98;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #1e1277;
        --accent-soft: #ccfbf1;
        --highlight-bg: #fef9c3;
        --highlight-border: #fde047;
        --border: #e5e7eb;
        --word-size: 26px;
        --radius: 14px;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.06);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- Header ---------- */
      header.app-header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #254689;
        color: #fff;
        padding: 18px 16px 16px;
        box-shadow: 0 2px 12px rgba(30, 18, 119, 0.25);
      }
      header.app-header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.2px;
        text-align: center;
      }

      /* ---------- Search ---------- */
      .search-wrap {
        max-width: 720px;
        margin: -1px auto 0;
        padding: 14px 14px;
        background: var(--bg);
        position: sticky;
        top: 60px;
        z-index: 9;
      }
      .search-wrap input {
        display: block;
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .search-wrap input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      /* ---------- Content ---------- */
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 14px 4px;
      }

      /* ---------- Card ---------- */
      .card {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin: 14px 0;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .card:first-child {
        margin-top: 0;
      }
      .card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px 9px 14px;
        border-bottom: 1px solid var(--border);
        background: #fafbfc;
        font-size: 12px;
        color: var(--muted);
      }
      .card-meta .badge {
        background: rgba(30, 18, 119, 0.1);
        color: var(--accent);
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        flex-shrink: 0;
      }
      .card-meta .title {
        flex: 1;
        min-width: 0;
        text-align: center;
        font-weight: 600;
        color: var(--text);
        line-height: 1.35;
      }
      .copy-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .copy-btn:hover {
        background: #f3f4f6;
        color: var(--text);
      }
      .copy-btn:active {
        transform: scale(0.94);
      }
      .copy-btn.copied {
        background: #dcfce7;
        border-color: #86efac;
        color: #166534;
      }
      .copy-btn svg {
        width: 15px;
        height: 15px;
        pointer-events: none;
      }

      .card-body {
        padding: 18px 16px 6px;
      }

      /* Word-by-word block */
      .words {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        direction: rtl;
        padding: 4px 0 14px;
      }
      .word {
        background: #f4f5ef;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px 6px;
        min-width: 84px;
        text-align: center;
        transition:
          transform 0.12s,
          box-shadow 0.12s,
          border-color 0.12s,
          background-color 0.15s;
        cursor: default;
      }
      .word.match {
        background: var(--highlight-bg);
        border-color: var(--highlight-border);
      }
      .word:active {
        transform: scale(0.97);
        border-color: var(--accent);
        box-shadow: 0 2px 8px rgba(30, 18, 119, 0.18);
      }
      .word .ar {
        font-family: 'Noto Naskh Arabic', serif;
        font-size: var(--word-size);
        font-weight: 600;
        color: #0f172a;
        line-height: 1.4;
        display: block;
        margin-top: 4px;
      }
      .word .tr {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.3;
        direction: ltr;
      }

      /* Empty state */
      .empty {
        text-align: center;
        padding: 40px 20px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(255, 255, 255, 0.08);
        border-radius: var(--radius);
        font-size: 15px;
      }
    </style>
  </head>

      const COPY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
      const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

      // ---------- Утилиты и нормализация ----------
      const listEl = document.getElementById('list');
      const searchEl = document.getElementById('search');

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // Удаляет арабские огласовки (харакаты), нормализует алиф и русскую "ё"
      function normalizeText(str) {
        return String(str)
          .toLowerCase()
          .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
          .replace(/[أإآٱ]/g, 'ا')
          .replace(/ё/g, 'е')
          .trim();
      }

      // ---------- Рендер ----------
      function renderCard(item, normalizedQuery) {
        const wordsHtml = item.words
          .map((w) => {
            const isMatch =
              normalizedQuery &&
              (normalizeText(w.ar).includes(normalizedQuery) ||
                normalizeText(w.tr).includes(normalizedQuery));

            return `
        <div class="word${isMatch ? ' match' : ''}">
          <span class="ar">${escapeHtml(w.ar)}</span>
          <span class="tr">${escapeHtml(w.tr)}</span>
        </div>
      `;
          })
          .join('');

        const metaHtml =
          item.tag || item.title
            ? `<div class="card-meta">
                 ${item.tag ? `<span class="badge">${escapeHtml(item.tag)}</span>` : ''}
                 ${item.title ? `<span class="title">${escapeHtml(item.title)}</span>` : ''}
                 <button class="copy-btn" data-copy-id="${item.id}" type="button" title="Скопировать дуа" aria-label="Скопировать дуа">${COPY_ICON}</button>
               </div>`
            : '';

        return `
        <article class="card" data-id="${item.id}">
          ${metaHtml}
          <div class="card-body">
            <div class="words">${wordsHtml}</div>
          </div>
        </article>
      `;
      }

      function render(query = '') {
        const q = normalizeText(query);
        const filtered = q
          ? TEXTS.filter(
              (t) =>
                (t.title && normalizeText(t.title).includes(q)) ||
                (t.tag && normalizeText(t.tag).includes(q)) ||
                t.words.some(
                  (w) => normalizeText(w.ar).includes(q) || normalizeText(w.tr).includes(q)
                )
            )
          : TEXTS;

        listEl.innerHTML = filtered.length
          ? filtered.map((item) => renderCard(item, q)).join('')
          : '<div class="empty">По вашему запросу ничего не найдено.</div>';
      }

      // Копирование полного текста дуа и перевода
      listEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.copy-btn');
        if (!btn) return;

        const id = Number(btn.dataset.copyId);
        const item = TEXTS.find((t) => t.id === id);
        if (!item) return;

        const arabicFull = item.words.map((w) => w.ar.trim()).join(' ');
        const translationFull = item.words.map((w) => w.tr.trim()).join(' ');
        const textToCopy = `${arabicFull}\n\n«${translationFull}»\n(${item.title})`;

        navigator.clipboard.writeText(textToCopy).then(() => {
          btn.innerHTML = CHECK_ICON;
          btn.classList.add('copied');
          setTimeout(() => {
            btn.innerHTML = COPY_ICON;
            btn.classList.remove('copied');
          }, 1600);
        });
      });

      searchEl.addEventListener('input', (e) => render(e.target.value));
      render();
    </script>
  </body>
</html>
